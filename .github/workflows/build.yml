name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: tess-ent-windows-x86_64.exe
            bin: tess-ent.exe
          - os: ubuntu-latest
            asset: tess-ent-linux-x86_64
            bin: tess-ent
          - os: macos-latest
            asset: tess-ent-macos-arm64
            bin: tess-ent
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Smoke test
        shell: bash
        run: ./target/release/${{ matrix.bin }} ref workflow > /dev/null
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.bin }} dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish-bin:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - name: Commit binaries to bin/
        run: |
          chmod +x bin/tess-ent-linux-x86_64 bin/tess-ent-macos-arm64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update bin/ executables [skip ci]"
          git push

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
